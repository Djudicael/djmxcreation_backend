[workspace]
members = [
    "crates/app-error",
    "crates/djmxcreation-backend-wasi",
    "crates/repository",
    "crates/app-service",
    "crates/test-util",
    "crates/app_core",
    "crates/app_config",
    "crates/migration",
    "crates/dev-server",
]

resolver = "3"
default-members = [
    "crates/app-error",
    "crates/djmxcreation-backend-wasi",
    "crates/repository",
    "crates/app-service",
    "crates/app_core",
    "crates/app_config",
]

[workspace.dependencies]
app-error = { path = "crates/app-error" }
app_config = { path = "crates/app_config" }
app_core = { path = "crates/app_core" }
app-service = { path = "crates/app-service" }
dotenv = "0.15.0"
dotenvy = "0.15"
repository = { path = "crates/repository" }
test-util = { path = "crates/test-util" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["json", "matched-path", "original-uri", "query", "tower-log", "tracing", "multipart", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hyper = "1.11.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.0", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["v4", "fast-rng", "serde"] }
wasi-pg-client = { version = "0.2.0", features = ["uuid", "serde-json", "chrono"] }
axum-test = "21.0"
rustainers = "0.15"
portpicker = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
getrandom = "0.4"

# Rust 1.97's wasm-component-ld crashes at linker optimization level O3 for
# crc-fast. Keep native release settings unchanged and use O2 for WASI builds.
[profile.wasi-release]
inherits = "release"
opt-level = 2
