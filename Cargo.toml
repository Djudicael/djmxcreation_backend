[workspace]
members = [
    "crates/app-error",
    "crates/djmxcreation-backend-wasi",
    "crates/repository",
    "crates/app-service",
    "crates/test-util",
    "crates/app_core",
    "crates/app_config",
    "crates/migration",
    "crates/dev-server",
    "crates/frontend-wasi",
    "crates/media-worker",
]

resolver = "3"
default-members = [
    "crates/app-error",
    "crates/djmxcreation-backend-wasi",
    "crates/repository",
    "crates/app-service",
    "crates/app_core",
    "crates/app_config",
]

[workspace.dependencies]
app-error = { path = "crates/app-error" }
app_config = { path = "crates/app_config" }
app_core = { path = "crates/app_core" }
app-service = { path = "crates/app-service" }
dotenv = "0.15.0"
dotenvy = "0.15"
repository = { path = "crates/repository" }
test-util = { path = "crates/test-util" }

anyhow = "1.0.104"
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.155", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["json", "matched-path", "original-uri", "query", "tower-log", "tracing", "multipart", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hyper = "1.12.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
url = "2.5"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.29.0", features = ["v4", "fast-rng", "serde"] }
# 0.2.1 requires a WASI P3 async entry point; the HTTP servers use wstd/P2.
wasi-pg-client = { version = "=0.2.1", features = ["uuid", "serde-json", "chrono"] }
axum-test = "21.1"
rustainers = "0.15.1"
portpicker = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
getrandom = "0.4"
sha2 = "0.11.1"
base64 = "0.23.1"
wstd = "0.6.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std", "image"] }
jpeg-encoder = "0.7.1"

# Rust 1.97's wasm-component-ld crashes at linker optimization level O3 for
# crc-fast. Keep native release settings unchanged and use O2 for WASI builds.
[profile.wasi-release]
inherits = "release"
opt-level = 2
