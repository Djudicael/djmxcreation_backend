[package]
name = "djmxcreation-media-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { workspace = true }
fast_image_resize = { workspace = true }
jpeg-encoder = { workspace = true }
app_config = { workspace = true }
app_core = { workspace = true }
repository = { workspace = true }
app-error = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wstd = { workspace = true }
wstd-axum = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
test-util = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
axum-test = { workspace = true }
